name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ARViewer.xcodeproj -scheme ARViewer \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ARViewer.app Payload/
          zip -qr ARViewer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARViewer-ipa
          path: ARViewer.ipa
