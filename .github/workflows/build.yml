name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          ls
          test -f project.yml || { echo "::error::Немає project.yml у корені"; exit 1; }
          ls *.swift || { echo "::error::Немає .swift файлів у корені"; exit 1; }
      - run: brew install xcodegen
      - name: Generate project
        run: |
          xcodegen generate > gen.log 2>&1 || { tail -n 8 gen.log | while read -r l; do echo "::error::GEN $l"; done; exit 1; }
      - name: Build
        run: |
          xcodebuild -project ARViewer.xcodeproj -scheme ARViewer -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:|Could not|fatal" build.log | head -8 | while read -r l; do echo "::error::BUILD $l"; done; tail -n 6 build.log | while read -r l; do echo "::error::TAIL $l"; done; exit 1; }
      - name: Package
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ARViewer.app Payload/
          zip -qr ARViewer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARViewer-ipa
          path: ARViewer.ipa
