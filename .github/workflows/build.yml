name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project.yml
        run: |
          cat > project.yml <<'EOF'
          name: ARViewer
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            ARViewer:
              type: application
              platform: iOS
              sources:
                - path: .
                  includes: ["*.swift"]
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.arviewer
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGNING_ALLOWED: "NO"
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: AR 3D
                  UILaunchScreen: {}
                  NSCameraUsageDescription: Камера потрібна для AR
                  UIFileSharingEnabled: true
                  LSSupportsOpeningDocumentsInPlace: true
          EOF
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ARViewer.xcodeproj -scheme ARViewer -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { grep -E "error:" build.log | head -8 | while read -r l; do echo "::error::BUILD $l"; done; exit 1; }
      - name: Package
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/ARViewer.app Payload/
          zip -qr ARViewer.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ARViewer-ipa
          path: ARViewer.ipa
